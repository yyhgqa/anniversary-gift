<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111014">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="我们的一周年">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4a45'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f2efdf'/%3E%3C/svg%3E">
<title>我们的一周年</title>
<link rel="stylesheet" href="style/fonts-msz.css">
<link rel="stylesheet" href="style/fonts-caveat.css">
<link rel="stylesheet" href="style/book-style.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="veil" id="veil">
  <div class="veil-stage"><div class="veil-field" id="veilField" aria-hidden="true"></div></div>
  <div class="veil-glow" aria-hidden="true"></div>
  <div class="veil-copy">
    <p class="veil-eyebrow">2025 &mdash; 2026</p>
    <h1 class="veil-title">我们的一周年</h1>
    <p class="veil-sub">给 姚慧彤</p>
    <p class="veil-hint"><span>轻触屏幕</span></p>
  </div>
</section>

<main class="shelf" id="shelf" aria-hidden="true">
  <div class="shelf-inner">
    <header class="shelf-head">
      <p class="shelf-eyebrow">OUR ANNIVERSARY</p>
      <h2 class="shelf-title">五本小书</h2>
      <p class="shelf-sub">写给同一件事：这一年，有你真好</p>
    </header>
    <div class="shelf-rows" id="shelfRows"></div>
    <footer class="shelf-foot">轻触封面，打开一本书</footer>
  </div>
</main>

<section class="reader" id="reader" aria-hidden="true">
  <div class="reader-bar">
    <button class="reader-back" id="closeBook" type="button">书架</button>
    <span class="reader-title" id="readerTitle"></span>
    <span class="reader-status" id="readerStatus"></span>
  </div>
  <div class="reader-stage" id="readerStage">
  </div>
  <div class="reader-controls">
    <button id="prevPage" type="button" aria-label="上一页">&#8592;</button>
    <span class="reader-hint" id="readerHint">左右滑动翻页</span>
    <button id="nextPage" type="button" aria-label="下一页">&#8594;</button>
  </div>
</section>

<script src="vendor/page-flip.browser.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
